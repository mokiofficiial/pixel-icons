plugins { id 'com.android.application' }

android {
    namespace 'com.pixel.iconpack'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pixel.iconpack'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            minifyEnabled false
            // debug key so the APK installs right away; use your own key for Play Store
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
